<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-ballot - Voter Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-card-container">
        <header class="card-header">
            <div class="logo-icon"><i class="fa-solid fa-check-to-slot"></i></div>
            <h1>E-ballot Login</h1>
            <p>Access your secure voting profile.</p>
        </header>

        <div class="feature-tags">
            <span class="feature-tag highlight"><i class="fas fa-fingerprint"></i> Aadhaar Authentication</span>
            <span class="feature-tag"><i class="fas fa-lock"></i> Password Secured</span>
            <span class="feature-tag"><i class="fas fa-user-check"></i> Profile Access</span>
        </div>

        <main class="content-section">
            <h3><span class="step-number">1</span> Voter Authentication</h3>
            <form id="voterLoginForm">

                <div class="form-group">
                    <label for="aadhaar"><i class="fas fa-id-card"></i> Aadhaar ID (Your Username):</label>
                    <input type="text" id="aadhaar" name="aadhaar" required pattern="\d{12}" maxlength="12" title="Enter your 12-digit Aadhaar number" placeholder="Enter your 12-digit Aadhaar ID">
                </div>

                <div class="form-group">
                    <label for="dob"><i class="fas fa-calendar-alt"></i> Date of Birth:</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password:</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your secret password">
                </div>
                
                <div class="form-group">
                    <button type="submit" class="action-btn">Secure Login</button>
                </div>

                <p style="text-align: center; margin-top: 10px; font-size: 0.95em;">
                    Don't have an account? 
                    <a href="registration.html" style="color: #28a745; text-decoration: none; font-weight: 600;">Register Here</a>
                </p>
            </form>
        </main>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
