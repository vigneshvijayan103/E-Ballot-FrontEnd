<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter Dashboard - E-ballot</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-card-container">
        <header class="card-header">
            <div class="logo-icon"><i class="fas fa-vote-yea"></i></div>
            <h1>Voter Dashboard</h1>
            <p>Welcome, <span id="voter-name">Voter Name</span>. Your secure access hub.</p>
        </header>

        <div class="feature-tags">
            <span class="feature-tag highlight"><i class="fas fa-fingerprint"></i> Authenticated</span>
            <span class="feature-tag"><i class="fas fa-map-marker-alt"></i> Constituency: Not defined</span>
        </div>

        <main class="content-section">
            
            <section class="voting-status-box">
                <h3 style="margin-bottom: 25px;"><span class="step-number">2</span> Election Status</h3>
                
                <div id="status-message" class="verification-box warning-box" style="background-color: #fff3e0; border-color: #ffcc80; color: #ff9800; text-align: center;">
                    <i class="fas fa-exclamation-triangle verification-icon" style="color: #ff9800; font-size: 2em; margin-bottom: 10px;"></i>
                    <p style="font-size: 1.2em; font-weight: 700; margin: 0;">VERIFICATION UNDER PROCESS</p>
                    <p style="margin-top: 5px; font-size: 0.9em;">Your eligibility is being reviewed. You cannot vote yet.</p>
                </div>
                
                <div class="info-details" style="display: flex; justify-content: space-around; gap: 15px; margin-top: 25px;">
                    <div style="text-align: center; padding: 10px; border-radius: 8px; flex: 1; background-color: #f8faff;">
                        <p style="font-weight: 600; color: #3f2b96; margin-bottom: 5px;">Election Date:</p>
                        <p id="election-date" style="font-size: 1.1em; font-weight: bold; color: #555;">Not Updated</p> 
                    </div>
                    <div style="text-align: center; padding: 10px; border-radius: 8px; flex: 1; background-color: #f8faff;">
                        <p style="font-weight: 600; color: #3f2b96; margin-bottom: 5px;">Time Remaining:</p>
                        <p id="time-remaining" style="font-size: 1.1em; font-weight: bold; color: #d9534f;">0 Days, 00:00:00</p>
                    </div>
                </div>
            </section>
            
            <hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;">

            <div class="form-group" style="text-align: center;">
                <button id="btn-start-voting" class="action-btn wide-btn" style="background-color: #999; cursor: not-allowed;" disabled>
                    <i class="fas fa-lock" style="margin-right: 10px;"></i> Access The Ballot (Locked)
                </button>
            </div>

            <p style="text-align: center; margin-top: 25px;">
                <a href="#" id="logout-link" style="color: #d9534f; text-decoration: none; font-weight: 600;"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </p>

        </main>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
