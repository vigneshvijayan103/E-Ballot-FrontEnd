
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-ballot - Voter Registration & Verification</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-card-container">
        <header class="card-header">
            <div class="logo-icon"><i class="fa-solid fa-check-to-slot"></i></div>
            <h1>E-ballot</h1>
            <p>Secure, Verified, and Transparent Democracy</p>
        </header>

        <div class="feature-tags">
            <span class="feature-tag"><i class="fas fa-cloud"></i>  End-to-End Encryption</span>
            <span class="feature-tag"><i class="fas fa-fingerprint"></i> Aadhaar Verified</span>
            <span class="feature-tag"><i class="fas fa-vote-yea"></i> One Vote Only</span>
            <span class="feature-tag highlight"><i class="fas fa-clock"></i> Real-time Results</span>
        </div>

        <main class="content-section">
            <h3><span class="step-number">1</span> Voter Registration & Aadhaar Check</h3>
            <form id="voterRegistrationForm">

                <div class="form-group">
                    <label for="name"><i class="fas fa-user"></i> Full Name:</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your full legal name">
                </div>

                <div class="form-group">
                    <label for="phone"><i class="fas fa-mobile-alt"></i> Mobile Number:</label>
                    <div class="mobile-input-group">
                        <span class="country-code">+91</span>
                        <input type="tel" id="phone" name="phone" required pattern="[0-9]{10}" maxlength="10" title="Enter a 10-digit mobile number" placeholder="e.g., 9876543210">
                    </div>
                </div>

                <div class="form-group">
                    <label for="dob"><i class="fas fa-calendar-alt"></i> Date of Birth:</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div class="form-group">
                    <label for="gender"><i class="fas fa-venus-mars"></i> Gender:</label>
                    <select id="gender" name="gender" required>
                        <option value="" disabled selected>Select Gender</option>
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                        <option value="O">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="aadhaar"><i class="fas fa-id-card"></i> Aadhaar ID (12 Digits):</label>
                    <input type="text" id="aadhaar" name="aadhaar" required pattern="\d{12}" maxlength="12" title="Aadhaar ID must be 12 digits" placeholder="Enter your 12-digit Aadhaar number">
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Create Password:</label>
                    <input type="password" id="password" name="password" required minlength="8" placeholder="Minimum 8 characters">
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword"><i class="fas fa-lock"></i> Confirm Password:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Re-enter your password">
                </div>
                <div class="form-group">
                <label for="constituency"><i class="fas fa-map-marker-alt"></i> Constituency:</label>
                <select id="constituency" name="constituencyId" required>
                    <option value="" disabled selected>Select Your Constituency</option>
                    <!-- Options will be dynamically populated via JS -->
                </select>
                    </div>


                <div id="otp-section" class="form-group" style="display: none; border-top: 1px solid #e0e0e0; padding-top: 20px; margin-top: 20px;">
                    <label for="otp"><i class="fas fa-key"></i> Enter OTP:</label>
                    <input type="text" id="otp" name="otp" pattern="\d{6}" maxlength="6" placeholder="Enter 6-digit OTP sent to Aadhaar linked mobile">
                </div>
                
                <div class="form-group">
                    <button type="button" id="btn-send-otp" class="action-btn">Send OTP for Aadhaar Verification</button>
                    
                    <button type="submit" id="btn-verify-proceed" class="action-btn wide-btn" style="display: none;">Verify & Proceed to Voting 🗳️</button>
                </div>
            </form>
        </main>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <script src="js/registration.js"></script>
</body>
</html>
